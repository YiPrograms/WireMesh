name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Test web console
        working-directory: web
        run: npm test
      - name: Build web console
        working-directory: web
        run: npm run build

  binaries:
    name: Binaries (${{ matrix.archive_arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            archive_arch: x86_64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            archive_arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install static-linking toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add "${{ matrix.rust_target }}"
      - name: Build release binaries
        run: >-
          cargo build --locked --release
          --target "${{ matrix.rust_target }}"
          -p wiremesh-controller
          -p wiremesh-agent-linux
          -p wiremesh-agent-mikrotik
      - name: Package release archive
        env:
          TARGET: ${{ matrix.rust_target }}
          ARCH: ${{ matrix.archive_arch }}
        run: |
          ref_name="${GITHUB_REF_NAME//\//-}"
          archive="wiremesh-${ref_name}-${ARCH}-unknown-linux-musl.tar.gz"
          install -d staging/bin staging/deploy
          install -m 0755 "target/${TARGET}/release/wiremesh-controller" staging/bin/
          install -m 0755 "target/${TARGET}/release/wiremesh-agent-linux" staging/bin/
          install -m 0755 "target/${TARGET}/release/wiremesh-agent-mikrotik" staging/bin/
          install -m 0644 deploy/wiremesh-agent-linux.service deploy/agent.env.example staging/deploy/
          install -m 0644 README.md staging/
          tar -C staging -czf "${archive}" .
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wiremesh-${{ matrix.archive_arch }}-unknown-linux-musl
          path: |
            wiremesh-*.tar.gz
            wiremesh-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  containers:
    name: Container (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            suffix: ""
            dockerfile: deploy/controller.Dockerfile
          - component: mikrotik-agent
            suffix: -mikrotik-agent
            dockerfile: deploy/mikrotik-agent.Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase image name
        id: image
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=WireMesh ${{ matrix.component }}
            org.opencontainers.image.description=WireMesh on-premises WireGuard access ${{ matrix.component }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wiremesh-*-unknown-linux-musl
          path: dist
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*/* --clobber
