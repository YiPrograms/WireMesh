services:
  controller:
    build:
      context: ..
      dockerfile: deploy/controller.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      WIREMESH_HOSTNAME: ${WIREMESH_HOSTNAME:-vpn.example.org}
      WIREMESH_BOOTSTRAP_ADMIN_EMAIL: ${WIREMESH_ADMIN_EMAIL:-admin@example.com}
      WIREMESH_BOOTSTRAP_ADMIN_NAME: ${WIREMESH_ADMIN_NAME:-Administrator}
      RUST_LOG: wiremesh_controller=info,tower_http=info
    volumes:
      - ${WIREMESH_DATA_PATH:-./data/controller}:/var/lib/wiremesh
    healthcheck:
      test: ["CMD", "/usr/local/bin/wiremesh-controller", "--database-url", "sqlite:///var/lib/wiremesh/wiremesh.db", "migrate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
